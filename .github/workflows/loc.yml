# One playable localization job (a stage of it): worker/loc_job.py on one record (inputs = ids only; every link, word and plan
# comes from the record's Options › locPlay, read with the repository secrets). Started by the caller's automation through the
# API (workflow_dispatch needs a token with Actions: write on this repository, so nobody else can start it).
#
# This repository is public, and so are its Actions logs. Same rules as erase.yml:
# - inputs are ids only (they show in the run name and in the step env header);
# - the worker prints step names, counts and timings only; the smoke tests' output stays in a file that is never uploaded;
# - no artifacts: the result is uploaded to the caller's hosting with a secret;
# - no pull_request / pull_request_target triggers, so a fork can never run a workflow with these secrets.
name: loc
run-name: loc ${{ inputs.job }}
on:
  workflow_dispatch:
    inputs:
      job:
        description: record id (rec…)
        required: true
      base:
        description: base id (app…)
        required: true
      table:
        description: table id (tbl…)
        required: true
permissions:
  contents: read
concurrency:
  group: loc-${{ inputs.job }}
  cancel-in-progress: false
jobs:
  loc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: tools
        # apt can hang on a slow mirror (endcard.yml, 2026-11-19): every apt call has its own time limit and 2 tries
        timeout-minutes: 9
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt_ffmpeg() {
            local o="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
            sudo DEBIAN_FRONTEND=noninteractive timeout 60 apt-get $o install -y -qq --no-install-recommends ffmpeg </dev/null >/dev/null 2>&1 && return 0
            sudo DEBIAN_FRONTEND=noninteractive timeout 60 apt-get $o update -qq </dev/null >/dev/null 2>&1
            sudo DEBIAN_FRONTEND=noninteractive timeout 90 apt-get $o install -y -qq --no-install-recommends ffmpeg </dev/null >/dev/null 2>&1
          }
          if command -v ffmpeg >/dev/null; then echo "ffmpeg preinstalled"; else
            for k in 1 2; do apt_ffmpeg && break; echo "apt try $k failed"; sleep 5; done
            command -v ffmpeg >/dev/null || { echo "::error::ffmpeg could not be installed"; exit 1; }
            echo "ffmpeg installed"; fi
          pip install -q -r requirements.txt
      - name: browser
        # the smoke tests drive Chromium through Playwright (pinned; the browser and its system libraries come with it)
        timeout-minutes: 8
        run: |
          npm install --no-save --no-audit --no-fund --silent playwright@1.57.0 >/dev/null 2>&1
          timeout 420 npx --no-install playwright install --with-deps chromium >/dev/null 2>&1 || { echo "::error::chromium could not be installed"; exit 1; }
          echo "chromium installed"
      - name: secrets present
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          miss=""; for k in AIRTABLE_TOKEN FAL_KEY; do [ -n "${!k}" ] || miss="$miss $k"; done
          if [ -n "$miss" ]; then echo "::error::missing repository secret(s):$miss"; exit 1; fi
          echo "all secrets set"
      - name: run job
        env:
          JOB: ${{ inputs.job }}
          BASE: ${{ inputs.base }}
          TABLE: ${{ inputs.table }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python3 worker/loc_job.py --job "$JOB" --base "$BASE" --table "$TABLE" --work "$RUNNER_TEMP/loc"
