# One static job: worker/static_job.py on one record field (inputs = ids only; the image link, the model ids and the
# prompts come from the field, read with the repository secrets). Started by the caller's automation through the API
# (workflow_dispatch needs a token with Actions: write on this repository, so nobody else can start it).
#
# This repository is public, and so are its Actions logs. Same rules as erase.yml:
# - inputs are ids only (they show in the run name and in the step env header);
# - the worker prints step names, counts and timings only;
# - no artifacts: the result is uploaded to the caller's hosting with a secret;
# - no pull_request / pull_request_target triggers, so a fork can never run a workflow with these secrets.
name: static
run-name: static ${{ inputs.job }}
on:
  workflow_dispatch:
    inputs:
      job:
        description: record id (rec…)
        required: true
      base:
        description: base id (app…)
        required: true
      table:
        description: table id (tbl…)
        required: true
      field:
        description: field id of the job JSON (fld…)
        required: true
permissions:
  contents: read
concurrency:
  group: static-${{ inputs.job }}
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: tools
        run: pip install -q -r requirements.txt
      - name: secrets present
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          miss=""; for k in AIRTABLE_TOKEN FAL_KEY; do [ -n "${!k}" ] || miss="$miss $k"; done
          if [ -n "$miss" ]; then echo "::error::missing repository secret(s):$miss"; exit 1; fi
          echo "all secrets set"
      - name: run job
        env:
          JOB: ${{ inputs.job }}
          BASE: ${{ inputs.base }}
          TABLE: ${{ inputs.table }}
          FIELD: ${{ inputs.field }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python3 worker/static_job.py --job "$JOB" --base "$BASE" --table "$TABLE" --field "$FIELD" --work "$RUNNER_TEMP/static"
