# Unit tests of the engine on drawn frames (tests/, no media files, no secrets). Runs on every push; it is a separate
# workflow from erase.yml on purpose: that one holds the job secrets and must never run on anything but a manual start.
name: test
on:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: ffmpeg
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v ffmpeg >/dev/null; then echo "ffmpeg preinstalled"; else
            sudo -E apt-get update -qq && sudo -E apt-get install -y -qq --no-install-recommends ffmpeg </dev/null >/dev/null; echo "ffmpeg installed"; fi
          ffmpeg -hide_banner -version | head -1
      - run: pip install -q -r requirements.txt
      - run: python -m unittest discover -s tests -v
